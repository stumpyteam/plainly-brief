<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plainly Brief</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h11M4 17h7"></path>
          </svg>
        </span>
        <h1>Plainly Brief <span class="ver" id="unlock">0.3.13</span></h1>
      </div>
    </header>

    <div class="themes" role="radiogroup" aria-label="Color mode">
      <button type="button" data-theme="system" role="radio" aria-label="System">System</button>
      <button type="button" data-theme="light" role="radio" aria-label="Light">Light</button>
      <button type="button" data-theme="dark" role="radio" aria-label="Dark">Dark</button>
      <button type="button" data-theme="dracula" role="radio" aria-label="Dracula" hidden>Dracula</button>
    </div>

    <div class="levels" role="radiogroup" aria-label="Reading level">
      <button type="button" data-level="plain" role="radio">Plain Summary</button>
      <button type="button" data-level="context" role="radio">More Context</button>
      <button type="button" data-level="points" role="radio">Bullet Points</button>
    </div>
    <section id="pay" class="pay" hidden>
      <p>More Context and Bullet Points are $4.99, once. Plain Summary stays free.</p>
      <button type="button" id="buy" class="primary">Buy unlock</button>
      <input id="code" type="text" autocomplete="off" spellcheck="false" placeholder="Paste unlock code" aria-label="Unlock code" />
      <button type="button" id="redeem">Unlock</button>
    </section>
    <p id="status" class="status" role="status"></p>

    <script src="license.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
